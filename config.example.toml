role = "controller"
edge_trigger_px = 2
debug_logging = false

[controller]
agent_host = "192.168.1.2"
# Control, pointer, keyboard, and clipboard metadata TCP port.
agent_port = 24800
remote_position = "right"

[agent]
listen_host = "0.0.0.0"
listen_port = 24800

[sharing]
clipboard_text = true
clipboard_html = true
clipboard_images = true
file_copy_paste = true
# Bidirectional file/folder drag and drop. Transfers always copy.
file_drag_drop = true
max_clipboard_bytes = 33554432
max_file_transfer_bytes = 21474836480
# File payload TCP port used by copy/paste and drag/drop.
bulk_transfer_port = 24802
incoming_cache_dir = "%LOCALAPPDATA%\\Borderless\\Incoming"
